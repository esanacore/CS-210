name: C++ Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    name: Build and run archived submission
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: g++ --version

      - name: Compile
        run: g++ -std=c++17 -Wall -Wextra -pedantic main.cpp GroceryAnalyzer.cpp -o corner-grocer

      - name: Run menu exit smoke test
        run: printf "4\n" | ./corner-grocer
